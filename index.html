<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Robin's activity</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h1>Robin's activity</h1>
    <a href="/api/data">View full JSON</a>
    <h2>Daily steps</h2>
    <canvas id="steps" aria-label="Daily steps" role="img"></canvas>
    <h2>Daily screen time</h2>
    <canvas id="minutes" aria-label="Daily screen time" role="img"></canvas>
    <h2>Steps by participant</h2>
    <canvas id="all-steps" aria-label="Steps by participant" role="img"></canvas>
    <h2>Screen time by participant</h2>
    <canvas id="all-minutes" aria-label="Screen minutes by participant" role="img"></canvas>
    <h2>Total class steps per day</h2>
    <canvas id="total" aria-label="Total class steps by date" role="img"></canvas>
    <h2>Mean steps per participant per day</h2>
    <canvas id="mean" aria-label="Mean steps per participant by date" role="img"></canvas>
    <p id="error" role="alert"></p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
